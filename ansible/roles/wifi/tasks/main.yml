# USB WiFi Realtek RTL8188EUS (0bda:8179, driver rtl8xxxu) → mạng chính khi HP không cắm dây LAN.
# Không khai báo trong autoinstall vì networkd chỉ nhận wifi theo ĐÚNG tên card (không match:)
# và bộ cài thiếu firmware cho chip này. Bản cài đầy đủ đã có firmware → card hiện tên wlx<MAC>.
- name: Gói cho WiFi WPA + firmware
  ansible.builtin.apt:
    name: [wpasupplicant, linux-firmware]
    state: present

- name: Tìm card WiFi USB (wlx…)
  ansible.builtin.shell: ls /sys/class/net | grep '^wl' | head -1
  register: wifi_if
  changed_when: false
  failed_when: wifi_if.stdout == ''

# File chứa mật khẩu WiFi → chỉ root đọc. Metric 600 > dây LAN (100): khi cắm dây, dây được ưu tiên.
- name: Cấu hình WiFi bằng netplan
  ansible.builtin.copy:
    dest: /etc/netplan/60-wifi.yaml
    mode: "0600"
    content: |
      # Quản lý bởi hp-lab Ansible
      network:
        version: 2
        wifis:
          {{ wifi_if.stdout }}:
            dhcp4: true
            dhcp4-overrides: {route-metric: 600}
            optional: true
            access-points:
              "{{ wifi_ssid }}":
                password: "{{ wifi_pass }}"
  no_log: true   # không in mật khẩu ra màn hình
  notify: Apply netplan

- name: Áp dụng netplan ngay (không chờ cuối playbook)
  ansible.builtin.meta: flush_handlers

- name: Chờ WiFi nhận IP
  ansible.builtin.shell: ip -4 -br addr show {{ wifi_if.stdout }} | grep -q -E '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'
  register: wifi_ip
  retries: 12
  delay: 5
  until: wifi_ip.rc == 0
  changed_when: false

- name: Thử ra Internet CHỈ qua WiFi
  ansible.builtin.command: ping -c 3 -W 3 -I {{ wifi_if.stdout }} 1.1.1.1
  changed_when: false
