- name: Rule nftables của máy lab
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s     # kiểm tra cú pháp trước khi ghi đè
  notify: Reload nftables

- name: Bật nftables khi khởi động
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
