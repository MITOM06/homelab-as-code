[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
# Giữ kiểm tra host key (bảo mật). Sau khi cài lại máy: ssh-keygen -R hp-lab.<your-tailnet>.ts.net

[privilege_escalation]
# Ubuntu 26.04 mặc định dùng sudo-rs: dấu nhắc mật khẩu khác → Ansible chờ không thấy, báo
# "Timeout waiting for privilege escalation prompt". sudo truyền thống vẫn có tên sudo.ws.
become_exe = sudo.ws

[ssh_connection]
pipelining = True
